<h2>Task List</h2>

<ul>
  <li *ngFor="let task of tasks"  [class.completed]="task.done">

    {{ task.title }}

    <!-- Conditional rendering -->
    <span *ngIf="task.done">✔</span>

    <!-- Interaction -->
    <button (click)="toggleTask(task)">
      Toggle
    </button>


    <button (click)="deleteTask(task.id)">
      Delete
    </button>

  </li>
</ul>

<input [(ngModel)]="newTaskTitle" placeholder="Enter task">

<button (click)="addTask()">
  Add Task
</button>
